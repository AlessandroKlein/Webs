packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"

# allowBuilds: controla qué paquetes pueden ejecutar scripts de instalación
# (postinstall). `@parcel/watcher` se bloquea (`false`) porque su script compila
# un binding nativo que solo se usa en modo watch (dev); en build/CI no se
# necesita, y bloquearlo evita fallos de compilación nativa en entornos limpios.
allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  # Electron descarga su binario en postinstall (~100 MB) y no se usa en
  # CI/Docker: la app se empaqueta a mano (`apps.yml`). Para correr
  # `pnpm --filter @webs/desktop electron:dev` en local, aprobalo con
  # `pnpm approve-builds` o poné `electron: true`.
  electron: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
