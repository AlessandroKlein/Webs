# ============================================================================
# Webs — nginx reverse-proxy endurecido (ADR-0017)
# Allowlist de rutas + multi-sucursal por hostname.
#
# Reemplaza al antiguo `docker/nginx.conf`. Es un drop-in para
# `/etc/nginx/conf.d/*.conf` (lo copia `docker/Dockerfile.web`).
#
# La sección `map $uri $route` se GENERA a partir del setting `public_routes`
# (array de paths, `*` = prefijo). Por defecto:
#     ['/', '/api/', '/ws', '/docs/']
#   · '/'      -> región SPA (assets estáticos + rutas client-side).
#   · '/api/'  -> proxy REST a `api:4000`.
#   · '/ws'    -> proxy WebSocket a `api:4000`.
#   · '/docs/' -> proxy Swagger a `api:4000`.
#
# Para ACOTAR una región (p. ej. quitar `/docs/`), quitar su entrada del map y
# agregar `~^PREFIJO deny;`. Recargar nginx tras editar `public_routes`.
# Ver docker/nginx/README.md para la receta completa de generación.
# ============================================================================

# ---- Allowlist por ruta (generada desde settings.public_routes) ------------
# `default` es la región SPA ("/"): habilita todo lo que no es un prefijo de
# backend listado más abajo. Si "/" no está en `public_routes`, se reemplaza
# por `default deny;` para dropear el frontend también.
map $uri $route {
    # ---- public_routes (REGENERAR al editar settings.public_routes) --------
    ~^/api/      api;    # '/api/'   (prefijo)
    ~^/ws($|/)   ws;     # '/ws'     (prefijo)
    ~^/docs/     docs;   # '/docs/'  (prefijo)

    # ---- '/' (SPA): assets estáticos + rutas client-side -------------------
    default      spa;    # quitar '/' -> `default deny;`
}

# ---- Endpoints internos SIEMPRE denegados en el borde (no listables) -------
# Aun listando '/api/', estos paths no se exponen por defecto: se dropean
# (444) ANTES de llegar a la API. Siguen protegidos por RBAC en la API si el
# operador los quita de esta lista (override explícito, p. ej. en un host
# interno de administración). Ajustar según el despliegue.
map $uri $internal_deny {
    default 0;
    ~^/api/v1/license($|/)         1;
    ~^/api/v1/roles($|/)           1;
    ~^/api/v1/audit($|/)           1;
    ~^/api/v1/system/backup($|/)   1;
}

server {
    listen 80;
    server_name _;   # multi-sucursal: ver multi-sucursal.conf.example

    root  /usr/share/nginx/html;
    index index.html;

    # Drop de paths no permitidos (antes de resolver locations).
    if ($route = deny)      { return 444; }
    if ($internal_deny = 1) { return 444; }

    # ---- Región SPA --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Región API --------------------------------------------------------
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Requerido por la resolución de organización por hostname (ADR-0017):
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ---- Región WebSocket --------------------------------------------------
    location /ws {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ---- Región Swagger ----------------------------------------------------
    location /docs/ {
        proxy_pass http://api:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
