# Ingress (NGINX Ingress Controller) — TLS + security headers + WebSocket.
# Entrada única: nginx (service-web) sirve estáticos y reenvía /api, /ws y
# /docs al service `api` (docker/nginx.conf). Sustituir `webs.example.com` por
# el dominio real y crear el Secret TLS (`webs-tls`) con cert-manager o manual.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webs
  namespace: webs
  labels:
    app.kubernetes.io/name: webs
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # WebSocket (chat/notificaciones en tiempo real) a través del ingress.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    # Security headers en el borde (aplican a estáticos y API por igual).
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - webs.example.com
      secretName: webs-tls
  rules:
    - host: webs.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
