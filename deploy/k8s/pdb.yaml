# PodDisruptionBudget: garantiza disponibilidad durante drenajes de nodo /
# mantenimiento. Con 3 réplicas, minAvailable=1 permite evacuar 2 sin cortar.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: webs
  labels:
    app.kubernetes.io/name: webs
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: webs
      component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: webs
  labels:
    app.kubernetes.io/name: webs
    app.kubernetes.io/component: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: webs
      component: web
