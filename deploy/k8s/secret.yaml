# Secretos de Webs. ADR-0008: NO commitear literales — en producción gestionar
# con sealed-secrets (kubeseal) o external-secrets (Vault/SSM/Secrets Manager).
# Aquí se declara la FORMA del Secret con placeholders; reemplazar los valores
# antes de aplicar. JWT_SECRET y JWT_REFRESH_SECRET deben ser >= 32 caracteres
# (apps/api/src/config/env.ts rechaza secretos débiles en producción).
#
# Ejemplo con sealed-secrets:
#   kubectl create secret generic webs-secret --dry-run=client -o yaml \
#     --from-literal=DATABASE_URL=... --from-literal=REDIS_URL=... \
#     --from-literal=JWT_SECRET=$(openssl rand -base64 48) \
#     --from-literal=JWT_REFRESH_SECRET=$(openssl rand -base64 48) \
#     --from-literal=ENCRYPTION_KEY=$(openssl rand -hex 32) | kubeseal -o yaml
apiVersion: v1
kind: Secret
metadata:
  name: webs-secret
  namespace: webs
  labels:
    app.kubernetes.io/name: webs
type: Opaque
stringData:
  # PostgreSQL (Postgres/MySQL/SQLite se eligen en el asistente de instalación).
  DATABASE_URL: "postgresql://webs:<PASSWORD>@postgres:5432/webs?schema=public"
  # Redis global (rate-limit, pub/sub WebSocket, cache, cola BullMQ). ADR-0008.
  REDIS_URL: "redis://redis:6379"
  # JWT (acceso) — >= 32 chars.
  JWT_SECRET: "<REPLACE_32_PLUS_CHARS>"
  # JWT (refresh) — >= 32 chars.
  JWT_REFRESH_SECRET: "<REPLACE_32_PLUS_CHARS>"
  # Clave maestra AES-256-GCM para cifrado de PII (openssl rand -hex 32).
  ENCRYPTION_KEY: "<REPLACE_64_HEX_CHARS>"
