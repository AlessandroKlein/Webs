# Deployment del frontend (nginx sirviendo estáticos de apps/web + reverse
# proxy a la API). Estateless: no lleva volumen ni estado local.
# Imagen: build de docker/Dockerfile.web (nginx:alpine + apps/web/dist + nginx.conf).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: webs
  labels:
    app.kubernetes.io/name: webs
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webs
      component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: webs
        component: web
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: web
          image: webs-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
