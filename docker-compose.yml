# Webs — arranque completo con un solo comando: `docker compose up -d --build`
# Luego abrí http://localhost:5173 y seguí el asistente de instalación (los
# valores de conexión ya vienen pre-cargados para estos servicios).
#
# Motores incluidos: PostgreSQL (recomendado) y MySQL (alternativa). Elegí uno
# en el asistente. SQLite no necesita servicio (usa un archivo local).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webs
      POSTGRES_PASSWORD: webs
      POSTGRES_DB: webs
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webs']
      interval: 5s
      timeout: 5s
      retries: 12

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: webs
      MYSQL_USER: webs
      MYSQL_PASSWORD: webs
    ports:
      - '3306:3306'
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u webs -pwebs --silent']
      interval: 5s
      timeout: 5s
      retries: 24

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production-please-0123456789
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - appdata:/app/data
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  pgdata: {}
  mysqldata: {}
  appdata: {}
