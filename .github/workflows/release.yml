name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ej. v2.14.0). Vacío = el tag del push.'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Resolver versión
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Extraer notas del CHANGELOG
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
            const start = lines.findIndex((l) => l.startsWith("## [" + v + "]"));
            if (start < 0) process.exit(0);
            let end = lines.findIndex((l, i) => i > start && /^## \[/.test(l));
            if (end < 0) end = lines.length;
            process.stdout.write(lines.slice(start, end).join("\n").trim() + "\n");
          ' > release-notes.md
          if [ -s release-notes.md ]; then
            echo "Notas extraídas del CHANGELOG ($(wc -l < release-notes.md) líneas)."
          else
            echo "Sin entrada en el CHANGELOG para $TAG; se usarán notas generadas."
          fi

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm --filter @webs/api exec prisma generate

      - name: Build del artefacto (API) y empaquetado
        run: |
          pnpm --filter @licensify/core --filter @webs/core --filter @webs/i18n --filter @webs/plugin-sdk --filter @webs/ui --filter @webs/plugin-example build
          pnpm --filter @webs/api build
          # El tarball empaqueta apps/api/dist como `dist/` (lo que el bootloader
          # intercambia en modo bare). En Docker la actualización es el rolling
          # update, pero el artefacto se adjunta igual para `update/raw`.
          tar -czf "webs-$VERSION.tar.gz" -C apps/api dist
          sha256sum "webs-$VERSION.tar.gz" | awk '{print $1}' > "webs-$VERSION.tar.gz.sha256"
          echo "ARTIFACT=webs-$VERSION.tar.gz" >> "$GITHUB_ENV"
          ls -la "webs-$VERSION.tar.gz" "webs-$VERSION.tar.gz.sha256"

      # La firma es opcional: si el secreto no está (o no es una privada válida)
      # la release se publica igual con el artefacto y su sha256. El updater
      # sigue rechazando artefactos sin .sig, así que la firma se exige para
      # distribuir, no para publicar.
      - name: Firmar artefacto (Ed25519 sobre sha256, opcional)
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATE_PRIVATE_KEY" ]; then
            echo "::warning::UPDATE_PRIVATE_KEY no configurada; se publica sin .sig."
            exit 0
          fi
          if node scripts/sign-release.mjs "$ARTIFACT"; then
            echo "Firma OK."
          else
            echo "::warning::No se pudo firmar con la clave configurada; se publica sin .sig."
          fi
          ls -la "$ARTIFACT" "$ARTIFACT.sha256" "$ARTIFACT.sig" 2>/dev/null || true

      - name: Crear release (notas + artefactos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSETS=("$ARTIFACT" "$ARTIFACT.sha256")
          if [ -f "$ARTIFACT.sig" ]; then ASSETS+=("$ARTIFACT.sig"); fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -s release-notes.md ]; then
              gh release create "$TAG" --notes-file release-notes.md --latest "${ASSETS[@]}"
            else
              gh release create "$TAG" --generate-notes --latest "${ASSETS[@]}"
            fi
          else
            echo "Release $TAG ya existe; se suben los artefactos."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          fi
