name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Extraer notas del CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
            const start = lines.findIndex((l) => l.startsWith("## [" + v + "]"));
            if (start < 0) process.exit(0);
            let end = lines.findIndex((l, i) => i > start && /^## \[/.test(l));
            if (end < 0) end = lines.length;
            process.stdout.write(lines.slice(start, end).join("\n").trim() + "\n");
          ' "$VERSION" > release-notes.md
          if [ -s release-notes.md ]; then
            echo "Notas extraídas del CHANGELOG ($(wc -l < release-notes.md) líneas)."
          else
            echo "Sin entrada en el CHANGELOG para $GITHUB_REF_NAME; se usarán notas generadas."
          fi

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm --filter @webs/api exec prisma generate

      - name: Build del artefacto (API) y empaquetado
        run: |
          pnpm --filter @licensify/core --filter @webs/core --filter @webs/i18n --filter @webs/plugin-sdk --filter @webs/ui --filter @webs/plugin-example build
          pnpm --filter @webs/api build
          VERSION="${GITHUB_REF_NAME#v}"
          # El tarball empaqueta apps/api/dist como `dist/` (lo que el bootloader
          # intercambia en modo bare). En Docker la actualización es el rolling
          # update, pero el artefacto se firma/adjunta igual para `update/raw`.
          tar -czf "webs-$VERSION.tar.gz" -C apps/api dist
          echo "ARTIFACT=webs-$VERSION.tar.gz" >> "$GITHUB_ENV"
          ls -la "webs-$VERSION.tar.gz"

      - name: Firmar artefacto (Ed25519 sobre sha256)
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          node scripts/sign-release.mjs "$ARTIFACT"
          ls -la "$ARTIFACT" "$ARTIFACT.sha256" "$ARTIFACT.sig"

      - name: Crear release (con notas + artefactos firmados)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT="webs-$VERSION.tar.gz"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ -s release-notes.md ]; then
              gh release create "$GITHUB_REF_NAME" --notes-file release-notes.md --latest \
                "$ARTIFACT" "$ARTIFACT.sha256" "$ARTIFACT.sig"
            else
              gh release create "$GITHUB_REF_NAME" --generate-notes --latest \
                "$ARTIFACT" "$ARTIFACT.sha256" "$ARTIFACT.sig"
            fi
          else
            echo "Release $GITHUB_REF_NAME ya existe; se suben los artefactos."
            gh release upload "$GITHUB_REF_NAME" "$ARTIFACT" "$ARTIFACT.sha256" "$ARTIFACT.sig" --clobber
          fi
